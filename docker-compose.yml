services:
  db:
    image: postgres:16
    container_name: sales_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sales_dw
      POSTGRES_USER: sales_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - sales_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_user -d sales_dw"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: sales_airflow
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__LOGGING__WORKER_LOG_SERVER_HOST: sales_airflow
      AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT: "8793"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: sales_dw
      DB_USER: sales_user
      DB_PASSWORD: ${DB_PASSWORD}
      PYTHONPATH: /opt/airflow/project
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./:/opt/airflow/project
    command: standalone

volumes:
  sales_data:
